name = "lean4lean"
defaultTargets = ["Lean4Lean", "lean4lean", "Lean4Lean.Theory", "Lean4Lean.Verify"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.33.0-rc2"

# Pinned to an exact commit (not the branch) so `lake update` cannot move it;
# changing this pin requires human sign-off (see CLAUDE.md).
[[require]]
name = "Foundation"
git = "https://github.com/vasnesterov/Foundation"
rev = "e17ebdbb2e2ffa63b8ca0341c818d88215f3c888"

[[require]]
scope = "leanprover"
name = "lean4export"
rev = "v4.30.0"

[[lean_lib]]
name = "Lean4Lean"

[[lean_lib]]
name = "Lean4Lean.Theory"
globs = ["Lean4Lean.Theory.*"]

[[lean_lib]]
name = "Lean4Lean.Verify"
globs = ["Lean4Lean.Verify.*"]

[[lean_lib]]
name = "Lean4Lean.Tests"
globs = ["Lean4Lean.Tests.*"]

[[lean_lib]]
name = "Lean4Lean.Experimental"
globs = ["Lean4Lean.Experimental.+"]

[[lean_exe]]
name = "lean4lean"
root = "Main"
supportInterpreter = true
